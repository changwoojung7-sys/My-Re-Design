  <!-- Expo iOS 웹뷰 User-Agent 보정 스크립트 (이니시스/포트원 파싱 에러 방지) -->
  <script>
    (function() {
      try {
        var ua = navigator.userAgent || '';
        if (ua.indexOf('MyReDesign-iOS-App') !== -1 && ua.indexOf('iPhone') === -1) {
          var fullIosUA = 'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1 ' + ua;
          Object.defineProperty(navigator, 'userAgent', {
            get: function() { return fullIosUA; },
            configurable: true
          });
        }
      } catch (e) {
        console.warn('UserAgent Polyfill Error:', e);
      }
    })();
  </script>
